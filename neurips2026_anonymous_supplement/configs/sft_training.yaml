# SFT (Supervised Fine-Tuning) configuration mirroring the constants used in
# scripts/10_sft_training.py.
#
# Trained on the same chosen-response distribution as DPO, to demonstrate the
# trade-off in capability preservation vs. sycophancy reduction.

base_model: meta-llama/Meta-Llama-3-8B-Instruct
adapter:
  type: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  precision: bfloat16
  optimizer: adamw_torch
  learning_rate: 5.0e-7
  batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 230
  warmup_ratio: 0.1
  max_length: 2048
  seed: 100

data:
  source: data/processed/master_sycophancy_balanced.jsonl
  format: chosen_response_only

eval:
  gsm8k_samples: 1319
  mmlu_samples: 500
  truthfulqa_samples: 500
  anthropic_samples: 500
